name: Build unsigned AcardKing.ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select a recent Xcode (needs the iOS 17 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AcardKing.xcodeproj from project.yml
        run: xcodegen generate

      - name: Build the app for a real iPhone (deliberately unsigned)
        run: |
          xcodebuild \
            -project AcardKing.xcodeproj \
            -scheme AcardKing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package into an .ipa (Payload/AcardKing.app zipped up)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AcardKing.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH — listing what does exist:"
            find build/Build/Products -maxdepth 2
            exit 1
          fi
          mkdir -p ipa-root/Payload
          cp -R "$APP_PATH" ipa-root/Payload/
          cd ipa-root
          zip -r ../AcardKing.ipa Payload
          cd ..

      - name: Upload AcardKing.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AcardKing-ipa
          path: AcardKing.ipa
          retention-days: 14
