name: AcardKing
options:
  bundleIdPrefix: com.acardking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AcardKing:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "Resources/**"
          - "project.yml"
          - "SETUP.md"
          - "CI-SETUP.md"
          - ".github/**"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: AcardKing
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "掃描名片需要使用相機"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: AcardKing
        PRODUCT_BUNDLE_IDENTIFIER: com.acardking.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        # Deliberately unsigned here — CI has no Apple ID / certificate.
        # Sideloadly (or AltStore) does the real signing later, on Windows,
        # using your own free Apple ID, right before installing to the phone.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
